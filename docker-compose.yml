services:
  backend:
    image: python:3.12-bookworm
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    command: bash -lc "pip install -r requirements.txt && python -m atkbrain.main"
    ports:
      - "2333:2333"
    environment:
      ATKBRAIN_HOST: 0.0.0.0
      ATKBRAIN_PORT: "2333"
      PYTHONUNBUFFERED: "1"
  frontend:
    image: node:20-bookworm
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    environment:
      ATKBRAIN_API_ORIGIN: http://backend:2333
      ATKBRAIN_FRONTEND_PORT: "2334"
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 2334 --strictPort"
    ports:
      - "2334:2334"
    depends_on:
      - backend
